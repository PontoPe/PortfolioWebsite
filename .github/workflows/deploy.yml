name: Deploy Website

on:
  push:
    branches:
      - main
  repository_dispatch:
    types: [update_blog]
  workflow_dispatch:

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      # 1. Baixa o código do SITE (PortfolioWebsite)
      - name: 🚚 Get latest code (Website)
        uses: actions/checkout@v4
        with:
          path: .

      # 2. Baixa o código do BLOG (ObsidianGit - Privado)
      - name: 🔐 Get private content (Obsidian)
        uses: actions/checkout@v4
        with:
          repository: PontoPe/ObsidianGit
          token: ${{ secrets.GH_PAT }} # O token permite ler o repo privado
          path: _content               # Salva numa pasta separada chamada "_content"
          fetch-depth: 1               # Baixa só a última versão (mais rápido)

      # 3. Configura o Node.js
      - name: ⚙️ Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # 4. Instala dependências
      - name: 📦 Install Dependencies
        run: npm ci

      # 5. PREPARAÇÃO DE CONTEÚDO (Mágica das Imagens)
      # Cria a pasta e copia todas as imagens (png, jpg, etc) do Obsidian para o Public do site
      - name: 🖼️ Move Blog Images to Public
        run: |
          mkdir -p public/blog-images
          find _content -type f \( -name "*.png" -o -name "*.jpg" -o -name "*.jpeg" -o -name "*.gif" -o -name "*.webp" \) -exec cp {} public/blog-images/ \;
          echo "Imagens copiadas com sucesso para public/blog-images"

      # 6. Build do Next.js
      - name: 🏗️ Build Project
        run: npm run build

      # 7. Deploy via FTP
      - name: 🚀 FTP Deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            node_modules/**
